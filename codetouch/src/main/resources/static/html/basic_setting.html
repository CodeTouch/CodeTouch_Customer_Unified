<div class="settings-container">
    <!-- Background & Layout Settings -->
    <div class="settings-section">
        <h3>Background & Layout</h3>
        <div class="settings-row">
            <label for="backgroundColor">배경색 :</label>
            <input type="color" id="backgroundColor" />
            <label for="borderStyle">경계선 종류:</label>
            <select id="borderStyle">
                <option value="solid">실선</option>
                <option value="dashed">대시선</option>
                <option value="dotted">점선</option>
                <option value="double">이중선</option>
                <option value="none">없음</option>
            </select>
            
        </div>
        <div class="settings-row">
            <label for="borderColor">경계선색:</label>
            <input type="color" id="borderColor" />
            <label for="borderWidth">경계선 두께(px) :</label>
            <input type="number" id="borderWidth" min="0"/>
        </div>
        <div class="settings-row">
            <label for="radius">모서리 둥글기(px) :</label>
            <input type="range" id="radius" min="0" max="50" step="5" />
            <label for="width">넓이(px) :</label>
            <input type="number" id="width" min="50" step="10"/>
        </div>
        <div class="settings-row">
            <label for="margin">바깥 여백 :</label>
            <input type="number" id="margin" min="0"/>
            <label for="height">높이(px) :</label>
            <input type="number" id="height" min="50" step="10"/>
        </div>
        <div class="settings-row">
            <label for="padding">안쪽 여백 :</label>
            <input type="number" id="padding" min="0"/>
            <label for="opacity">투명도 :</label>
            <input type="number" id="opacity" min="0" max="1" step="0.05"/>
        </div>
        <div class="settings-row">
            <label for="hyperlink">링크 :</label>
            <input type="url" id="hyperlink" />
            <label for="imageURL">이미지 주소 :</label>
            <input type="url" id="imageURL" />
        </div>
    </div>

    <!-- Typography Settings -->
    <div class="settings-section">
        <h3>Typography</h3>
        <div class="settings-row">
            <label for="textColor">글자색 :</label>
            <input type="color" id="textColor" />
            <label for="fontSize">글자 크기 :</label>
            <input type="number" id="fontSize" min="10" step="3"/>
        </div>
        <div class="settings-row">
            <label for="fontWeight">글자 굵기 :</label>
            <select id="fontWeight">
                <option value="200">얇게</option>
                <option value="400">보통</option>
                <option value="700">굵게</option>
            </select>
            <label for="fontFamily">글꼴 :</label>
            <select id="fontFamily">
                <option value="Nanum Gothic">Nanum Gothic(한글)</option>
                <option value="Diphylleia">Diphylleia(한글)</option>
                <option value="Nanum Pen Script">Nanum Pen Script(한글)</option>
                <option value="Jua">Jua(한글)</option>
                <option value="Open Sans">Open Sans(영어)</option>
                <option value="Oswald">Oswald(영어)</option>
                <option value="Nanum Gothic">Nanum Gothic(영어)</option>
            </select>
        </div>
        <div class="settings-row">
            <label for="textAlign">글자 정렬 :</label>
            <select id="textAlign">
                <option value="left">왼쪽</option>
                <option value="center">가운데</option>
                <option value="right">오른쪽</option>
                <option value="justify">양쪽 정렬</option>
            </select>
            <label for="lineHeight">줄 간격 :</label>
            <input type="number" id="lineHeight" min="1" step="0.1" value="1"/>
        </div>
        <div class="settings-row">
            <label for="letterSpacing">글자 간격 :</label>
            <input type="number" id="letterSpacing" min="0"/>
            <label for="textDirection">글자 방향 :</label>
            <select id="textDirection">
                <option value="ltr">왼쪽 -> 오른쪽 (LTR)</option>
                <option value="rtl">오른쪽 -> 왼쪽 (RTL)</option>
                <option value="auto">자동</option>
            </select>
        </div>
    </div>
</div>
